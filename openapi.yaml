openapi: 3.1.0
info:
  title: Instagram Graph API (subset for app builders)
  version: "25.0"
  description: |
    Generated: 2026-10-13. Curated contract for the Instagram Graph API via Meta Graph API
    (Business/Creator accounts linked to a Facebook Page) and the Instagram API with
    Instagram Login (graph.instagram.com — same paths, different host/token/scopes).
    Covers auth, identity, media read/publish/update/delete, stories, hashtags, business
    discovery, insights, comments, messaging, mentions/tags, and webhooks.
    Verify versions, metrics, and permissions against Meta for Developers before production use.
servers:
  - url: https://graph.facebook.com/{version}
    description: Facebook Login flavor (Page access token)
    variables:
      version:
        default: v25.0
  - url: https://graph.instagram.com/{version}
    description: Instagram Login flavor (IG user token, no Page)
    variables:
      version:
        default: v25.0
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: identity
  - name: media
  - name: publishing
  - name: discovery
  - name: insights
  - name: comments
  - name: messaging
  - name: webhooks
paths:
  /{ig-user-id}:
    get:
      tags: [identity]
      summary: Get IG user profile
      parameters:
        - $ref: '#/components/parameters/IgUserId'
        - name: fields
          in: query
          schema: { type: string, example: "id,username,account_type,media_count" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IgUser' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{ig-user-id}/media:
    get:
      tags: [media]
      summary: List media on IG user
      parameters:
        - $ref: '#/components/parameters/IgUserId'
        - name: fields
          in: query
          schema: { type: string, example: "id,caption,media_type,media_url,permalink,timestamp" }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MediaList' } } } }
        '400': { $ref: '#/components/responses/Error' }
    post:
      tags: [publishing]
      summary: Create media container (step 1 of publishing)
      description: For video/Reels poll GET /{container-id}?fields=status_code until FINISHED before publishing.
      parameters:
        - $ref: '#/components/parameters/IgUserId'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                image_url: { type: string, format: uri, description: Public HTTPS URL (image). Mutually exclusive with video_url. }
                video_url: { type: string, format: uri, description: Public HTTPS URL (video/Reel). }
                media_type: { type: string, enum: [REELS, CAROUSEL, STORIES], description: Required for Reels/Stories; omit for single image. }
                caption: { type: string }
                location_id: { type: string }
                alt_text: { type: string }
                is_carousel_item: { type: boolean }
                children: { type: string, description: Comma-separated container IDs for carousel parent. }
      responses:
        '200': { description: Container created, content: { application/json: { schema: { $ref: '#/components/schemas/Container' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{ig-user-id}/media_publish:
    post:
      tags: [publishing]
      summary: Publish container (step 2 of publishing)
      parameters:
        - $ref: '#/components/parameters/IgUserId'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [creation_id]
              properties:
                creation_id: { type: string, description: "Container ID from POST /{ig-user-id}/media" }
      responses:
        '200': { description: Published, content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{container-id}:
    get:
      tags: [publishing]
      summary: Get container status
      parameters:
        - name: container-id
          in: path
          required: true
          schema: { type: string }
        - name: fields
          in: query
          schema: { type: string, example: "status_code,status" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContainerStatus' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{media-id}:
    get:
      tags: [media]
      summary: Get media object
      parameters:
        - name: media-id
          in: path
          required: true
          schema: { type: string }
        - name: fields
          in: query
          schema: { type: string, example: "id,caption,media_type,media_url,thumbnail_url,permalink,timestamp,like_count,comments_count" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Media' } } } }
        '400': { $ref: '#/components/responses/Error' }
    post:
      tags: [publishing]
      summary: Update media (caption, comment_enabled)
      description: Only whitelisted fields on PUBLISHED media IDs are mutable.
      parameters:
        - name: media-id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                caption: { type: string }
                comment_enabled: { type: boolean }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      tags: [publishing]
      summary: Delete published media (permanent)
      parameters:
        - name: media-id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{media-id}/children:
    get:
      tags: [media]
      summary: List carousel children
      parameters:
        - name: media-id
          in: path
          required: true
          schema: { type: string }
        - name: fields
          in: query
          schema: { type: string, example: "id,media_type,media_url,thumbnail_url" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MediaList' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{ig-user-id}/stories:
    get:
      tags: [media]
      summary: List active stories (expire after 24h)
      parameters:
        - $ref: '#/components/parameters/IgUserId'
        - name: fields
          in: query
          schema: { type: string, example: "id,media_type,media_url,timestamp" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MediaList' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{ig-user-id}/content_publishing_limit:
    get:
      tags: [publishing]
      summary: Read publishing quota usage
      parameters:
        - $ref: '#/components/parameters/IgUserId'
        - name: fields
          in: query
          schema: { type: string, example: "quota_usage,rate_limit_settings,config" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PublishingLimit' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{ig-user-id}/conversations:
    get:
      tags: [messaging]
      summary: List Instagram conversations
      parameters:
        - $ref: '#/components/parameters/IgUserId'
        - name: platform
          in: query
          schema: { type: string, example: "instagram" }
        - name: fields
          in: query
          schema: { type: string, example: "id,participants,updated_time" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationList' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{ig-user-id}/tags:
    get:
      tags: [media]
      summary: Media where the account was tagged
      parameters:
        - $ref: '#/components/parameters/IgUserId'
        - name: fields
          in: query
          schema: { type: string, example: "id,caption,media_type,permalink" }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MediaList' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{ig-user-id}/block:
    post:
      tags: [comments]
      summary: Block an account (confirm param name on your version)
      parameters:
        - $ref: '#/components/parameters/IgUserId'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                block_user_id: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{ig-user-id}/unblock:
    post:
      tags: [comments]
      summary: Unblock an account
      parameters:
        - $ref: '#/components/parameters/IgUserId'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                block_user_id: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /ig_hashtag_search:
    get:
      tags: [discovery]
      summary: Resolve a hashtag name to a hashtag ID
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: q
          in: query
          required: true
          schema: { type: string, example: "paris2026" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Hashtag' } } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{hashtag-id}/top_media:
    get:
      tags: [discovery]
      summary: Top media for a hashtag
      parameters:
        - name: hashtag-id
          in: path
          required: true
          schema: { type: string }
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: fields
          in: query
          schema: { type: string, example: "id,caption,permalink,timestamp,like_count" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MediaList' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{hashtag-id}/recent_media:
    get:
      tags: [discovery]
      summary: Recent media for a hashtag
      parameters:
        - name: hashtag-id
          in: path
          required: true
          schema: { type: string }
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: fields
          in: query
          schema: { type: string, example: "id,caption,permalink,timestamp,like_count" }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MediaList' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /instagram_oembed:
    get:
      tags: [media]
      summary: oEmbed for a public post (auth requirements vary by version)
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, format: uri }
        - name: fields
          in: query
          schema: { type: string, example: "author_name,provider_name,html,thumbnail_url" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }
  /oauth/access_token:
    get:
      tags: [auth]
      summary: Code exchange and fb_exchange_token long-lived exchange
      parameters:
        - name: grant_type
          in: query
          schema: { type: string, enum: [fb_exchange_token] }
        - name: client_id
          in: query
          schema: { type: string }
        - name: client_secret
          in: query
          schema: { type: string }
        - name: redirect_uri
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: fb_exchange_token
          in: query
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { access_token: { type: string }, token_type: { type: string }, expires_in: { type: integer } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /debug_token:
    get:
      tags: [auth]
      summary: Verify token validity, scopes, expiry
      parameters:
        - name: input_token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{page-id}/subscribed_apps:
    post:
      tags: [webhooks]
      summary: Subscribe a Page's app to webhook fields
      parameters:
        - name: page-id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                subscribed_fields: { type: string, example: "comments,messages,mentions" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{ig-user-id}/insights:
    get:
      tags: [insights]
      summary: Account insights
      parameters:
        - $ref: '#/components/parameters/IgUserId'
        - name: metric
          in: query
          required: true
          schema: { type: string, example: "reach,impressions,profile_views" }
        - name: period
          in: query
          schema: { type: string, enum: [day, week, days_28, month, lifetime], default: day }
        - name: since
          in: query
          schema: { type: integer, format: int64 }
        - name: until
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Insights' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{media-id}/insights:
    get:
      tags: [insights]
      summary: Media insights
      parameters:
        - name: media-id
          in: path
          required: true
          schema: { type: string }
        - name: metric
          in: query
          required: true
          schema: { type: string, example: "reach,impressions,engagement,saved" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Insights' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{media-id}/comments:
    get:
      tags: [comments]
      summary: List comments on media
      parameters:
        - name: media-id
          in: path
          required: true
          schema: { type: string }
        - name: fields
          in: query
          schema: { type: string, example: "id,text,username,timestamp,like_count" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CommentList' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{comment-id}/replies:
    get:
      tags: [comments]
      summary: List replies to a comment
      parameters:
        - name: comment-id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CommentList' } } } }
        '400': { $ref: '#/components/responses/Error' }
    post:
      tags: [comments]
      summary: Reply to a comment
      parameters:
        - name: comment-id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        '200': { description: Reply created, content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{comment-id}:
    post:
      tags: [comments]
      summary: Hide or unhide a comment
      parameters:
        - name: comment-id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [hide]
              properties:
                hide: { type: boolean }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      tags: [comments]
      summary: Delete a comment
      parameters:
        - name: comment-id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{ig-user-id}/mentioned_media:
    get:
      tags: [comments]
      summary: Get media the user was mentioned in (caption mention)
      parameters:
        - $ref: '#/components/parameters/IgUserId'
        - name: fields
          in: query
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MediaList' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /{ig-user-id}/messages:
    post:
      tags: [messaging]
      summary: Send Instagram message (requires instagram_manage_messages; 24h window rules apply)
      parameters:
        - $ref: '#/components/parameters/IgUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '200': { description: Sent, content: { application/json: { schema: { type: object, properties: { recipient_id: { type: string }, message_id: { type: string } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /webhooks:
    get:
      tags: [webhooks]
      summary: Webhook verification (hub.mode / hub.verify_token / hub.challenge)
      parameters:
        - name: hub.mode
          in: query
          schema: { type: string, enum: [subscribe] }
        - name: hub.verify_token
          in: query
          schema: { type: string }
        - name: hub.challenge
          in: query
          schema: { type: string }
      responses:
        '200': { description: Return hub.challenge verbatim as plain text }
    post:
      tags: [webhooks]
      summary: Webhook event delivery (comments, messages, mentions, story_insights)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookPayload' }
      responses:
        '200': { description: Acknowledge with 200 quickly; process async }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Page access token (or user token where noted). Query param access_token also accepted by Graph API.
  parameters:
    IgUserId:
      name: ig-user-id
      in: path
      required: true
      schema: { type: string }
      description: Instagram Business/Creator account ID
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 25 }
  responses:
    Error:
      description: Graph API error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    IgUser:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        account_type: { type: string, enum: [BUSINESS, CREATOR, MEDIA_CREATOR] }
        media_count: { type: integer }
    Media:
      type: object
      properties:
        id: { type: string }
        caption: { type: string }
        media_type: { type: string, enum: [IMAGE, VIDEO, CAROUSEL_ALBUM] }
        media_product_type: { type: string, enum: [FEED, REELS, STORY] }
        media_url: { type: string, format: uri }
        thumbnail_url: { type: string, format: uri }
        permalink: { type: string, format: uri }
        timestamp: { type: string, format: date-time }
        like_count: { type: integer }
        comments_count: { type: integer }
    MediaList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Media' } }
        paging: { $ref: '#/components/schemas/Paging' }
    Container:
      type: object
      properties:
        id: { type: string, description: Container (creation) ID }
    ContainerStatus:
      type: object
      properties:
        id: { type: string }
        status_code: { type: string, enum: [IN_PROGRESS, FINISHED, ERROR, EXPIRED, PUBLISHED] }
        status: { type: string }
    Insights:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              period: { type: string }
              values: { type: array, items: { type: object, properties: { value: {}, end_time: { type: string } } } }
              id: { type: string }
    Comment:
      type: object
      properties:
        id: { type: string }
        text: { type: string }
        username: { type: string }
        timestamp: { type: string, format: date-time }
        like_count: { type: integer }
        hidden: { type: boolean }
    CommentList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Comment' } }
        paging: { $ref: '#/components/schemas/Paging' }
    SendMessageRequest:
      type: object
      required: [recipient, message]
      properties:
        recipient: { type: object, required: [id], properties: { id: { type: string, description: IGSID (Instagram-scoped ID) } } }
        message: { type: object, properties: { text: { type: string }, attachment: { type: object } } }
        messaging_type: { type: string, enum: [RESPONSE, UPDATE, MESSAGE_TAG] }
        tag: { type: string, description: Required when messaging outside 24h window with MESSAGE_TAG }
    WebhookPayload:
      type: object
      properties:
        object: { type: string, example: "instagram" }
        entry:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              time: { type: integer }
              changes: { type: array, items: { type: object } }
              messaging: { type: array, items: { type: object } }
    Paging:
      type: object
      properties:
        cursors: { type: object, properties: { before: { type: string }, after: { type: string } } }
        next: { type: string, format: uri }
    Hashtag:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
    PublishingLimit:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              quota_usage: { type: integer }
              rate_limit_settings: { type: array, items: { type: object } }
              config: { type: object }
    ConversationList:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              participants: { type: object }
              updated_time: { type: string }
        paging: { $ref: '#/components/schemas/Paging' }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: integer, example: "190" }
            error_subcode: { type: integer }
            fbtrace_id: { type: string }
