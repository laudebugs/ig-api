name: Deploy docs site to GitHub Pages

# Builds site/index.html from the Markdown sources and deploys it.
# One-time repo setup: Settings → Pages → Source → "GitHub Actions".
# If your default branch is not `main`, update the branch filter below.

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "INSTAGRAM_GRAPH_API.md"
      - "FORMATS.md"
      - "docs/**"
      - "scripts/build-site.py"
      - "scripts/highlight*.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install highlighting dependency
        run: npm ci --ignore-scripts

      - name: Build static site
        run: |
          python scripts/build-site.py
          test -s site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
