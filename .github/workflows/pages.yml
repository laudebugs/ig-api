name: Deploy docs site to GitHub Pages

# Builds and deploys the static documentation site to GitHub Pages.
# Supports both:
# 1. "Deploy from a branch" (branch: gh-pages, folder: /) - Required for PR previews
# 2. "GitHub Actions" source
#
# When deploying to gh-pages branch, pr-preview directory is preserved so active PR
# preview deployments are never overwritten.

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "INSTAGRAM_GRAPH_API.md"
      - "FORMATS.md"
      - "docs/**"
      - "scripts/build-site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static site
        run: |
          python scripts/build-site.py
          test -s site/index.html

      # Deploy to gh-pages branch, preserving any active PR previews
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview

      # Upload Pages artifact for environments using native GitHub Actions Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Deploy via native GitHub Actions if the repo's Pages source is set to "GitHub Actions"
  deploy-github-actions:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
